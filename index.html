<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GameHub</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070a14;
  --panel:#11182c;
  --panel2:#18213a;
  --text:#fff;
  --muted:#9ca8c7;
  --purple:#795cff;
  --blue:#00d5ff;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 15% 0%,#27346c 0,transparent 32%),
    radial-gradient(circle at 90% 5%,#3a205e 0,transparent 28%),
    var(--bg);
}

button,input{font:inherit}

header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 5%;
  background:rgba(7,10,20,.82);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:28px;
  font-weight:1000;
}

.logo span{
  color:var(--blue);
}

.musicBtn,
.closeBtn,
.fullBtn{
  border:1px solid #344263;
  background:#151e36;
  color:white;
  border-radius:13px;
  padding:10px 15px;
  cursor:pointer;
}

.hero{
  text-align:center;
  padding:70px 5% 35px;
}

.hero h1{
  font-size:clamp(42px,8vw,80px);
  margin:0;
  font-weight:1000;
  background:linear-gradient(90deg,#fff,#8deaff,#947bff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
  font-size:18px;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:15px 5%;
}

.search{
  width:270px;
  padding:14px 17px;
  border-radius:14px;
  border:1px solid #344263;
  background:#11182c;
  color:white;
  outline:none;
}

.filter{
  padding:12px 17px;
  border:1px solid #344263;
  border-radius:13px;
  background:#11182c;
  color:white;
  cursor:pointer;
}

.filter.active{
  background:linear-gradient(135deg,var(--purple),var(--blue));
  border-color:transparent;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(285px,1fr));
  gap:22px;
  padding:35px 5% 80px;
}

.card{
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  border-radius:25px;
  background:linear-gradient(145deg,#151d35,#0d1325);
  box-shadow:0 15px 45px rgba(0,0,0,.25);
  transition:.25s;
}

.card:hover{
  transform:translateY(-7px);
  border-color:#6f5cff;
}

.preview{
  height:190px;
  background:#090f1d;
}

.preview svg{
  width:100%;
  height:100%;
}

.cardBody{
  padding:20px;
}

.cardBody h2{
  margin-top:0;
}

.cardBody p{
  min-height:45px;
  color:var(--muted);
}

.best{
  color:#7ce9ff;
  margin-bottom:12px;
}

.play{
  width:100%;
  padding:14px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  cursor:pointer;
}

/* GAME */

#gameScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(2,4,10,.97);
  overflow:auto;
}

.gameWindow{
  width:min(1050px,94%);
  min-height:calc(100vh - 40px);
  margin:20px auto;
  padding:25px;
  border:1px solid #303e64;
  border-radius:28px;
  background:linear-gradient(145deg,#141c35,#0d1325);
}

.gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.gameButtons{
  display:flex;
  gap:8px;
}

.gameArea{
  text-align:center;
}

.bigBtn{
  padding:14px 22px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  color:white;
  font-weight:900;
  cursor:pointer;
}

.modeGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:18px;
  margin:25px 0;
}

.mode{
  padding:25px 15px;
  border:1px solid #303d64;
  border-radius:20px;
  background:#18213b;
  cursor:pointer;
  transition:.2s;
}

.mode:hover{
  transform:translateY(-5px);
  border-color:#7b60ff;
}

.modeIcon{
  font-size:50px;
}

/* CLOUD */

.characterGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  margin:25px 0;
}

.character{
  padding:15px;
  border:1px solid #303d64;
  border-radius:20px;
  background:#151e35;
  cursor:pointer;
  transition:.2s;
}

.character:hover{
  transform:scale(1.03);
  border-color:#765cff;
}

.character svg{
  width:100%;
  height:130px;
}

.matchLayout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.artBox{
  min-height:280px;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  border:1px solid #2c3a5c;
  border-radius:22px;
  background:#080f1d;
}

.artBox svg{
  width:100%;
  max-width:370px;
  height:270px;
}

.sliders{
  display:flex;
  flex-direction:column;
  gap:22px;
  padding:20px;
  border-radius:22px;
  background:#10182c;
}

.sliderRow{
  text-align:left;
}

.sliderRow label{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

input[type=range]{
  width:100%;
  height:12px;
  appearance:none;
  border-radius:20px;
  cursor:pointer;
}

.hue{
  background:linear-gradient(
    90deg,
    red,
    yellow,
    lime,
    cyan,
    blue,
    magenta,
    red
  );
}

.light{
  background:linear-gradient(90deg,#111,#777,#fff);
}

.black{
  background:linear-gradient(90deg,#fff,#777,#000);
}

.score{
  font-size:32px;
  font-weight:1000;
  margin:18px;
}

/* MEMORY */

.memoryGrid{
  max-width:700px;
  margin:25px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.memoryCard{
  aspect-ratio:1;
  border:0;
  border-radius:18px;
  background:#253250;
  color:white;
  font-size:42px;
  cursor:pointer;
  transition:.2s;
}

.memoryCard.open{
  background:#725aff;
}

/* TARGET */

.targetArea{
  height:500px;
  position:relative;
  overflow:hidden;
  border:1px solid #2c3a5c;
  border-radius:20px;
  background:#080e1c;
}

.target{
  position:absolute;
  width:65px;
  height:65px;
  border-radius:50%;
  border:3px solid white;
  background:radial-gradient(
    circle,
    white 0 12%,
    #ff4963 13% 32%,
    white 33% 52%,
    #ff4963 53% 72%,
    white 73%
  );
}

/* SNAKE */

.snakeBoard{
  position:relative;
  width:min(700px,100%);
  aspect-ratio:1;
  margin:auto;
  overflow:hidden;
  border:2px solid #29405e;
  background:#06101a;
}

.snakeSegment{
  position:absolute;
  width:4%;
  height:4%;
  border-radius:35%;
}

.playerHead,
.playerBody{
  background:#55e96c;
  box-shadow:0 0 8px #55e96c;
}

.enemyHead,
.enemyBody{
  background:#ff6363;
  box-shadow:0 0 7px #ff6363;
}

.food{
  position:absolute;
  width:4%;
  height:4%;
  border-radius:50%;
  background:#ffd43b;
  box-shadow:0 0 15px #ffd43b;
}

.dpad{
  display:grid;
  grid-template-columns:repeat(3,60px);
  justify-content:center;
  gap:6px;
  margin-top:15px;
}

.dpad button{
  height:55px;
  border:0;
  border-radius:12px;
  background:#202c4b;
  color:white;
  font-size:22px;
}

/* FULLSCREEN */

#gameScreen:fullscreen{
  background:#050711;
}

#gameScreen:fullscreen .gameWindow{
  width:100%;
  min-height:100vh;
  margin:0;
  border:0;
  border-radius:0;
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:15px 4%;
  }

  .hero{
    padding:45px 5% 25px;
  }

  .grid{
    grid-template-columns:1fr;
    padding:25px 4% 60px;
  }

  .gameWindow{
    width:100%;
    min-height:100vh;
    margin:0;
    border-radius:0;
    padding:17px;
  }

  .gameTop{
    align-items:flex-start;
  }

  .gameTop h1{
    font-size:24px;
  }

  .gameButtons{
    flex-direction:column;
  }

  .matchLayout{
    grid-template-columns:1fr;
  }

  .memoryGrid{
    gap:7px;
  }

  .memoryCard{
    font-size:30px;
  }

  .targetArea{
    height:390px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">GAME<span>HUB</span> 🎮</div>
  <button class="musicBtn" onclick="toggleMusic()" id="musicButton">
    🎵 Musik an
  </button>
</header>

<section class="hero">
  <h1>PLAY. MATCH. WIN.</h1>
  <p>Deine eigene Game-Zentrale.</p>
</section>

<div class="controls">
  <input
    class="search"
    id="search"
    placeholder="🔎 Spiel suchen..."
    oninput="renderGames()">

  <button class="filter active" onclick="setFilter('all',this)">
    Alle
  </button>

  <button class="filter" onclick="setFilter('skill',this)">
    Skill
  </button>

  <button class="filter" onclick="setFilter('arcade',this)">
    Arcade
  </button>

  <button class="filter" onclick="setFilter('memory',this)">
    Memory
  </button>
</div>

<main class="grid" id="games"></main>

<div id="gameScreen">

  <div class="gameWindow">

    <div class="gameTop">

      <h1 id="gameTitle">Spiel</h1>

      <div class="gameButtons">
        <button class="fullBtn" onclick="toggleFullscreen()">
          ⛶ Vollbild
        </button>

        <button class="closeBtn" onclick="closeGame()">
          ✕ Schließen
        </button>
      </div>

    </div>

    <div class="gameArea" id="gameContent"></div>

  </div>

</div>

<script>

/* ==============================
   SPIELE
============================== */

const games=[
  {
    id:"cloud",
    name:"Cloud Match",
    description:"Cartoons, Flaggen und Farben perfekt nachmachen.",
    category:"skill"
  },
  {
    id:"memory",
    name:"Memory Mix",
    description:"Finde alle Cartoon-Paare.",
    category:"memory"
  },
  {
    id:"target",
    name:"Target Rush",
    description:"Klicke die Ziele bevor sie verschwinden.",
    category:"arcade"
  },
  {
    id:"snake",
    name:"Snake Arena",
    description:"Viele Schlangen kämpfen gleichzeitig.",
    category:"arcade"
  },
  {
    id:"math",
    name:"Math Rush",
    description:"Rechne so schnell wie möglich.",
    category:"skill"
  }
];

let filter="all";

function setFilter(f,btn){

  filter=f;

  document.querySelectorAll(".filter")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  renderGames();
}

/* ==============================
   SPIELBILDER
============================== */

function previewSVG(id){

  if(id==="cloud"){
    return `
    <svg viewBox="0 0 500 250">
      <defs>
        <linearGradient id="cloudBg">
          <stop stop-color="#142b50"/>
          <stop offset="1" stop-color="#29184e"/>
        </linearGradient>
      </defs>

      <rect width="500" height="250" fill="url(#cloudBg)"/>

      <circle cx="400" cy="60" r="35" fill="#ffd84c"/>

      <circle cx="170" cy="135" r="45" fill="#fff"/>
      <circle cx="225" cy="110" r="60" fill="#fff"/>
      <circle cx="280" cy="135" r="45" fill="#fff"/>

      <circle cx="205" cy="135" r="18" fill="#00d5ff"/>
      <circle cx="255" cy="135" r="18" fill="#7b5cff"/>

      <text x="250" y="220"
        text-anchor="middle"
        fill="white"
        font-size="22"
        font-weight="bold">
        CLOUD MATCH
      </text>
    </svg>`;
  }

  if(id==="memory"){
    return `
    <svg viewBox="0 0 500 250">
      <rect width="500" height="250" fill="#10182e"/>

      <rect x="55" y="30" width="110" height="85" rx="15" fill="#29375b"/>
      <rect x="195" y="30" width="110" height="85" rx="15" fill="#29375b"/>
      <rect x="335" y="30" width="110" height="85" rx="15" fill="#29375b"/>

      <rect x="55" y="135" width="110" height="85" rx="15" fill="#29375b"/>
      <rect x="195" y="135" width="110" height="85" rx="15" fill="#29375b"/>
      <rect x="335" y="135" width="110" height="85" rx="15" fill="#29375b"/>

      <text x="110" y="90" text-anchor="middle" font-size="45">🧽</text>
      <text x="250" y="90" text-anchor="middle" font-size="45">👽</text>
      <text x="390" y="90" text-anchor="middle" font-size="45">🤖</text>
      <text x="110" y="195" text-anchor="middle" font-size="45">🐱</text>
      <text x="250" y="195" text-anchor="middle" font-size="45">🦆</text>
      <text x="390" y="195" text-anchor="middle" font-size="45">👾</text>
    </svg>`;
  }

  if(id==="target"){
    return `
    <svg viewBox="0 0 500 250">
      <rect width="500" height="250" fill="#090f1d"/>

      <circle cx="130" cy="85" r="42" fill="white"/>
      <circle cx="130" cy="85" r="29" fill="#ff4963"/>
      <circle cx="130" cy="85" r="14" fill="white"/>

      <circle cx="360" cy="155" r="48" fill="white"/>
      <circle cx="360" cy="155" r="33" fill="#ff4963"/>
      <circle cx="360" cy="155" r="16" fill="white"/>

      <text x="250" y="225"
        fill="white"
        text-anchor="middle"
        font-size="22">
        TARGET RUSH
      </text>
    </svg>`;
  }

  if(id==="snake"){
    return `
    <svg viewBox="0 0 500 250">
      <rect width="500" height="250" fill="#06131b"/>

      <path d="M40 90 Q110 30 190 90 T350 90"
        fill="none"
        stroke="#55e96c"
        stroke-width="28"
        stroke-linecap="round"/>

      <path d="M110 175 Q190 225 285 170 T450 170"
        fill="none"
        stroke="#ff6363"
        stroke-width="28"
        stroke-linecap="round"/>

      <circle cx="40" cy="90" r="17" fill="#8dff9b"/>
      <circle cx="110" cy="175" r="17" fill="#ff9a9a"/>

      <text x="250" y="35"
        fill="white"
        text-anchor="middle"
        font-size="22">
        SNAKE ARENA
      </text>
    </svg>`;
  }

  return `
  <svg viewBox="0 0 500 250">
    <rect width="500" height="250" fill="#18213b"/>
    <text x="250" y="145"
      text-anchor="middle"
      font-size="70">➗</text>
  </svg>`;
}

function renderGames(){

  const search=
    document.getElementById("search").value.toLowerCase();

  const list=games.filter(g=>
    (filter==="all"||g.category===filter)&&
    g.name.toLowerCase().includes(search)
  );

  document.getElementById("games").innerHTML=
    list.map(g=>`

      <article class="card">

        <div class="preview">
          ${previewSVG(g.id)}
        </div>

        <div class="cardBody">

          <h2>${g.name}</h2>

          <p>${g.description}</p>

          <div class="best">
            🏆 Best:
            ${localStorage.getItem("best_"+g.id)||0}
          </div>

          <button class="play"
            onclick="startGame('${g.id}')">
            ▶ Spielen
          </button>

        </div>

      </article>

    `).join("");
}

/* ==============================
   GAME SYSTEM
============================== */

function startGame(id){

  stopMusic();

  if(id==="cloud") cloudMenu();
  if(id==="memory") memoryGame();
  if(id==="target") targetRush();
  if(id==="snake") snakeGame();
  if(id==="math") mathRush();
}

function openGame(title,content){

  document.getElementById("gameTitle").textContent=title;

  document.getElementById("gameContent").innerHTML=content;

  document.getElementById("gameScreen").style.display="block";
}

function closeGame(){

  if(document.fullscreenElement)
    document.exitFullscreen();

  document.getElementById("gameScreen").style.display="none";

  document.getElementById("gameContent").innerHTML="";

  if(musicWanted)
    startMusic();
}

/* ==============================
   FULLSCREEN
============================== */

function toggleFullscreen(){

  const screen=document.getElementById("gameScreen");

  if(!document.fullscreenElement){

    if(screen.requestFullscreen)
      screen.requestFullscreen();

  }else{

    if(document.exitFullscreen)
      document.exitFullscreen();
  }
}

/* ==============================
   CLOUD MATCH MENU
============================== */

function cloudMenu(){

  openGame("☁️ Cloud Match",`

    <h2>Wähle deine Challenge</h2>

    <div class="modeGrid">

      <div class="mode"
        onclick="cartoonCharacters()">

        <div class="modeIcon">📺</div>

        <h2>Cartoon Color</h2>

        <p>
          Wähle eine Cartoon-Figur
          und passe ihre Farbe an.
        </p>

      </div>

      <div class="mode"
        onclick="startCloud('flag')">

        <div class="modeIcon">🌍</div>

        <h2>Flag Match</h2>

        <p>
          Farben von Flaggen treffen.
        </p>

      </div>

      <div class="mode"
        onclick="startCloud('mixed')">

        <div class="modeIcon">🔥</div>

        <h2>Gemischt</h2>

        <p>
          Alles durcheinander.
        </p>

      </div>

    </div>
  `);
}

/* ==============================
   CARTOON CHARACTERS
============================== */

const characters=[

  {
    id:"sponge",
    name:"SpongeBob",
    emoji:"🧽",
    hue:52,
    light:58,
    black:5
  },

  {
    id:"simpsons",
    name:"Simpsons",
    emoji:"🟡",
    hue:52,
    light:55,
    black:8
  },

  {
    id:"patrick",
    name:"Patrick",
    emoji:"⭐",
    hue:350,
    light:58,
    black:7
  },

  {
    id:"rick",
    name:"Rick",
    emoji:"🧑‍🔬",
    hue:185,
    light:48,
    black:12
  },

  {
    id:"morty",
    name:"Morty",
    emoji:"👦",
    hue:40,
    light:55,
    black:10
  },

  {
    id:"cartoon",
    name:"Überraschung",
    emoji:"👾",
    hue:275,
    light:50,
    black:15
  }

];

function cartoonCharacters(){

  openGame("📺 Cartoon Color",`

    <h2>Wähle eine Figur</h2>

    <p>
      Suche dir eine Figur aus und versuche anschließend,
      die Zielfarbe möglichst genau zu treffen.
    </p>

    <div class="characterGrid">

      ${characters.map(c=>`

        <div class="character"
          onclick="startCartoon('${c.id}')">

          ${characterSVG(c,0)}

          <h3>${c.name}</h3>

        </div>

      `).join("")}

    </div>

  `);
}

function characterSVG(c,h){

  const color=
    h===0
      ? `hsl(${c.hue},75%,${c.light-c.black*.35}%)`
      : `hsl(${h.h},75%,${h.light-h.black*.35}%)`;

  return `
  <svg viewBox="0 0 200 140">

    <rect width="200" height="140"
      rx="20"
      fill="#0a1121"/>

    <circle cx="100" cy="72"
      r="48"
      fill="${color}"/>

    <circle cx="82" cy="65"
      r="7"
      fill="#111"/>

    <circle cx="118" cy="65"
      r="7"
      fill="#111"/>

    <path d="M75 90 Q100 108 125 90"
      fill="none"
      stroke="#111"
      stroke-width="6"
      stroke-linecap="round"/>

    <text x="100" y="130"
      text-anchor="middle"
      font-size="15">
      ${c.emoji} ${c.name}
    </text>

  </svg>`;
}

let currentCharacter=null;
let cartoonScore=0;
let cartoonRound=0;

function startCartoon(id){

  currentCharacter=
    characters.find(c=>c.id===id);

  cartoonScore=0;
  cartoonRound=0;

  cartoonRoundScreen();
}

function cartoonRoundScreen(){

  if(cartoonRound>=5){

    saveBest("cloud",cartoonScore);

    openGame("🏆 Cartoon Color",`

      <div style="font-size:70px">📺</div>

      <h2>Cartoon Color fertig!</h2>

      <div class="score">
        ${cartoonScore}/500
      </div>

      <button class="bigBtn"
        onclick="cartoonCharacters()">
        Nochmal
      </button>

    `);

    return;
  }

  const variation={
    h:Math.floor(Math.random()*40)-20,
    light:Math.floor(Math.random()*30)-15,
    black:Math.floor(Math.random()*20)-10
  };

  const target={
    h:(currentCharacter.hue+variation.h+360)%360,
    light:Math.max(10,
      Math.min(90,currentCharacter.light+variation.light)),
    black:Math.max(0,
      Math.min(70,currentCharacter.black+variation.black))
  };

  openGame("📺 Cartoon Color",`

    <div class="score">
      Runde ${cartoonRound+1}/5 · ${cartoonScore} Punkte
    </div>

    <div class="matchLayout">

      <div>

        <h3>🎯 Ziel</h3>

        <div class="artBox">
          ${characterSVG(currentCharacter,target)}
        </div>

      </div>

      <div>

        <h3>🎨 Deine Version</h3>

        <div class="artBox"
          id="cartoonPreview">

function updateCartoon(){

  const h=+document.getElementById("ch").value;
  const l=+document.getElementById("cl").value;
  const b=+document.getElementById("cb").value;

  document.getElementById("cv1").textContent=h+"°";
  document.getElementById("cv2").textContent=l+"%";
  document.getElementById("cv3").textContent=b+"%";

  document.getElementById("cartoonPreview").innerHTML=
    characterSVG(currentCharacter,{h,l,black:b});
}

function checkCartoon(th,tl,tb){

  const h=+document.getElementById("ch").value;
  const l=+document.getElementById("cl").value;
  const b=+document.getElementById("cb").value;

  const dh=Math.min(Math.abs(h-th),360-Math.abs(h-th));
  const dl=Math.abs(l-tl);
  const db=Math.abs(b-tb);

  const accuracy=Math.max(
    0,
    Math.round(
      100-Math.min(100,
        dh/1.8+dl*.7+db*.7
      )
    )
  );

  const points=accuracy*1;

  cartoonScore+=points;

  document.getElementById("gameContent").innerHTML+=`

    <div style="margin-top:20px">

      <h2>${accuracy}% getroffen!</h2>

      <p>+${points} Punkte</p>

      <button class="bigBtn"
        onclick="nextCartoon()">
        Weiter →
      </button>

    </div>
  `;
}

function nextCartoon(){

  cartoonRound++;

  cartoonRoundScreen();
}

/* ==============================
   MEMORY
============================== */

function memoryGame(){

  const icons=[
    "🧽","🧽",
    "👽","👽",
    "🤖","🤖",
    "🐱","🐱",
    "🦆","🦆",
    "👾","👾",
    "🦸","🦸",
    "🧑‍🔬","🧑‍🔬"
  ].sort(()=>Math.random()-.5);

  let first=null;
  let lock=false;
  let matches=0;
  let moves=0;

  openGame("🧠 Memory Mix",`
    <h2>Finde alle Paare!</h2>
    <p id="memoryInfo">Züge: 0</p>
    <div class="memoryGrid" id="memoryGrid"></div>
  `);

  const grid=document.getElementById("memoryGrid");

  icons.forEach(icon=>{

    const card=document.createElement("button");

    card.className="memoryCard";
    card.textContent="❓";

    card.onclick=()=>{

      if(lock||card.classList.contains("open"))
        return;

      card.classList.add("open");
      card.textContent=icon;

      if(!first){

        first={card,icon};
        return;
      }

      moves++;

      document.getElementById("memoryInfo").textContent=
        "Züge: "+moves;

      if(first.icon===icon){

        matches++;
        first=null;

        if(matches===8){

          const points=Math.max(0,1000-moves*20);

          saveBest("memory",points);

          setTimeout(()=>{

            openGame("🏆 Memory Mix",`

              <div style="font-size:70px">🧠</div>

              <h2>Alle gefunden!</h2>

              <div class="score">
                ${points} Punkte
              </div>

              <button class="bigBtn"
                onclick="memoryGame()">
                Nochmal
              </button>

            `);

          },400);
        }

      }else{

        lock=true;

        const old=first;

        setTimeout(()=>{

          old.card.classList.remove("open");
          old.card.textContent="❓";

          card.classList.remove("open");
          card.textContent="❓";

          first=null;
          lock=false;

        },650);
      }
    };

    grid.appendChild(card);
  });
}

/* ==============================
   TARGET RUSH
============================== */

function targetRush(){

  let score=0;
  let time=20;
  let running=true;

  openGame("🎯 Target Rush",`
    <h2 id="targetScore">Punkte: 0</h2>
    <h3 id="targetTime">Zeit: 20</h3>
    <div class="targetArea" id="targetArea"></div>
  `);

  const area=document.getElementById("targetArea");

  function spawn(){

    if(!running)return;

    area.innerHTML="";

    const target=document.createElement("div");

    target.className="target";

    target.style.left=Math.random()*85+"%";
    target.style.top=Math.random()*82+"%";

    target.onclick=()=>{

      score+=10;

      document.getElementById("targetScore")
        .textContent="Punkte: "+score;

      spawn();
    };

    area.appendChild(target);

    /* deutlich schneller */
    const delay=Math.max(180,650-score*3);

    setTimeout(()=>{

      if(running&&area.contains(target)){
        target.remove();
        spawn();
      }

    },delay);
  }

  spawn();

  const timer=setInterval(()=>{

    time--;

    if(document.getElementById("targetTime"))
      document.getElementById("targetTime")
        .textContent="Zeit: "+time;

    if(time<=0){

      clearInterval(timer);
      running=false;

      saveBest("target",score);

      openGame("🏆 Target Rush",`

        <div style="font-size:70px">🎯</div>

        <h2>Runde beendet!</h2>

        <div class="score">
          ${score} Punkte
        </div>

        <button class="bigBtn"
          onclick="targetRush()">
          Nochmal
        </button>

      `);
    }

  },1000);
}

/* ==============================
   SNAKE
============================== */

function snakeGame(){

  const size=25;

  let player={
    x:12,
    y:12,
    dir:{x:1,y:0},
    body:[
      {x:12,y:12},
      {x:11,y:12},
      {x:10,y:12}
    ]
  };

  let enemies=[
    enemy(5,5,1,0),
    enemy(19,6,-1,0),
    enemy(6,19,0,-1),
    enemy(19,19,-1,0)
  ];

  let food={
    x:17,
    y:13
  };

  let score=0;
  let alive=true;

  function enemy(x,y,dx,dy){

    return {
      dir:{x:dx,y:dy},
      body:[
        {x,y},
        {x:x-dx,y:y-dy},
        {x:x-dx*2,y:y-dy*2},
        {x:x-dx*3,y:y-dy*3},
        {x:x-dx*4,y:y-dy*4}
      ]
    };
  }

  openGame("🐍 Snake Arena",`

    <h2 id="snakeScore">
      Punkte: 0
    </h2>

    <div class="snakeBoard"
      id="snakeBoard">
    </div>

    <div class="dpad">

      <span></span>
      <button onclick="changeSnake(0,-1)">▲</button>
      <span></span>

      <button onclick="changeSnake(-1,0)">◀</button>
      <button onclick="changeSnake(0,1)">▼</button>
      <button onclick="changeSnake(1,0)">▶</button>

    </div>

    <p>
      🐍 Deine Schlange ist grün.
      Andere Schlangen sind rot.
    </p>
  `);

  window.changeSnake=function(dx,dy){

    if(
      dx===-player.dir.x &&
      dy===-player.dir.y
    )return;

    player.dir={x:dx,y:dy};
  };

  document.onkeydown=e=>{

    if(e.key==="ArrowUp")
      changeSnake(0,-1);

    if(e.key==="ArrowDown")
      changeSnake(0,1);

    if(e.key==="ArrowLeft")
      changeSnake(-1,0);

    if(e.key==="ArrowRight")
      changeSnake(1,0);
  };

  function render(){

    const board=document.getElementById("snakeBoard");

    if(!board)return;

    board.innerHTML="";

    function draw(p,cls){

      const el=document.createElement("div");

      el.className="snakeSegment "+cls;

      el.style.left=(p.x*4)+"%";
      el.style.top=(p.y*4)+"%";

      board.appendChild(el);
    }

    player.body.forEach((p,i)=>
      draw(p,i===0?"playerHead":"playerBody")
    );

    enemies.forEach(e=>
      e.body.forEach((p,i)=>
        draw(p,i===0?"enemyHead":"enemyBody")
      )
    );

    const f=document.createElement("div");

    f.className="food";
    f.style.left=(food.x*4)+"%";
    f.style.top=(food.y*4)+"%";

    board.appendChild(f);
  }

  function step(){

    if(!alive)return;

    const head={
      x:player.body[0].x+player.dir.x,
      y:player.body[0].y+player.dir.y
    };

    if(
      head.x<0||
      head.y<0||
      head.x>=size||
      head.y>=size
    ){
      end();
      return;
    }

    player.body.unshift(head);

    if(
      head.x===food.x &&
      head.y===food.y
    ){

      score+=10;

      food={
        x:Math.floor(Math.random()*size),
        y:Math.floor(Math.random()*size)
      };

    }else{

      player.body.pop();
    }

    enemies.forEach(e=>{

      const h=e.body[0];

      let dx=e.dir.x;
      let dy=e.dir.y;

      if(Math.random()<.35){

        dx=Math.sign(food.x-h.x);
        dy=Math.sign(food.y-h.y);

        if(
          Math.abs(food.x-h.x)>
          Math.abs(food.y-h.y)
        )dy=0;
        else dx=0;
      }

      if(h.x+dx<0||h.x+dx>=size)
        dx=-dx;

      if(h.y+dy<0||h.y+dy>=size)
        dy=-dy;

      e.dir={x:dx,y:dy};

      e.body.unshift({
        x:h.x+dx,
        y:h.y+dy
      });

      e.body.pop();
    });

    /*
      WICHTIG:
      Nur der hintere Bereich einer
      gegnerischen Schlange kann
      von vorne getroffen werden.
    */

    enemies=enemies.filter(e=>{

      const tailStart=
        Math.max(2,e.body.length-3);

      for(
        let i=tailStart;
        i<e.body.length;
        i++
      ){

        if(
          player.body[0].x===e.body[i].x &&
          player.body[0].y===e.body[i].y
        ){

          score+=50;
          return false;
        }
      }

      return true;
    });

    document.getElementById("snakeScore")
      .textContent="Punkte: "+score;

    render();
  }

  function end(){

    alive=false;

    saveBest("snake",score);

    openGame("🐍 Snake Arena",`

      <div style="font-size:70px">🐍</div>

      <h2>Game Over</h2>

      <div class="score">
        ${score} Punkte
      </div>

      <button class="bigBtn"
        onclick="snakeGame()">
        Nochmal
      </button>
    `);
  }

  render();

  const loop=setInterval(()=>{

    if(!alive){
      clearInterval(loop);
      return;
    }

    step();

  },170);
}

/* ==============================
   STARTSEITEN-MUSIK
============================== */

let audioCtx=null;
let musicTimer=null;
let musicWanted=true;

function startMusic(){

  if(!musicWanted||musicTimer)return;

  if(!audioCtx){

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();
  }

  if(audioCtx.state==="suspended")
    audioCtx.resume();

  const notes=[
    261.63,
    329.63,
    392,
    493.88,
    392,
    329.63
  ];

  let i=0;

  function note(){

    if(!musicWanted)return;

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.type="sine";

    osc.frequency.value=
      notes[i%notes.length];

    gain.gain.setValueAtTime(
      .015,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+.45
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
      audioCtx.currentTime+.45
    );

    i++;
  }

  note();

  musicTimer=
    setInterval(note,500);
}

function stopMusic(){

  if(musicTimer){

    clearInterval(musicTimer);
    musicTimer=null;
  }
}

function toggleMusic(){

  musicWanted=!musicWanted;

  document.getElementById("musicButton")
    .textContent=
      musicWanted
      ?"🎵 Musik an"
      :"🔇 Musik aus";

  if(musicWanted)
    startMusic();
  else
    stopMusic();
}

document.addEventListener(
  "click",
  ()=>{
    if(musicWanted&&!musicTimer)
      startMusic();
  },
  {once:true}
);

renderGames();

</script>
